name: Feature request
description: Propose a focused improvement for local repository navigation.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Navigation problem
      description: What is difficult to discover or inspect today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe what the user should be able to do.
    validations:
      required: true
  - type: textarea
    id: trust
    attributes:
      label: Privacy and trust-boundary impact
      description: Would this execute code, use a model, require a network call, or transfer repository content?
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: Current behavior and future ideas can remain clearly separated.
          required: true
        - label: Any network/model requirement would be explicit and opt-in rather than hidden.
          required: true
