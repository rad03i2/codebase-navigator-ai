name: Bug report
description: Report reproducible behavior that differs from Codebase Navigator AI's current documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove proprietary source, secrets, usernames, and private paths before posting.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "Example: 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Example: 3.12.5"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or API call
      description: Redact private repository names and paths.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal synthetic reproduction
      description: Prefer a tiny fabricated repository structure instead of real proprietary code.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets and sensitive repository content.
          required: true
        - label: I checked the documented current limitations.
          required: true
