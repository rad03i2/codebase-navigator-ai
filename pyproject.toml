[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-navigator-ai"
version = "1.0.0"
description = "Local-first codebase navigator for structural search and Python symbol discovery."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
keywords = ["codebase", "navigation", "search", "ast", "developer-tools"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
codebase-nav = "codebase_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
